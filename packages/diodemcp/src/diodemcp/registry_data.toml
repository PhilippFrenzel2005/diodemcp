# Canonical DiodeMCP multi-domain capability rules across T1-T7 threat surfaces.
# Loaded via stdlib `tomllib` and merged with optional user `~/.diodemcp/config.toml`.

[self_protection]
# C4 / R7: Unconditional critical self-protection surfaces (MUTATES_SENSITIVE | HIGH_SECRET).
paths = [
    "~/.diodemcp",
    "~/.diodemcp/**",
    "**/.diodemcp",
    "**/.diodemcp/**",
    "engine.sock",
    "engine.addr",
    "admin.secret",
    "~/.claude.json",
    "**/.claude.json",
    "~/.claude",
    "~/.claude/**",
    ".claude",
    ".claude/**",
    "**/.claude",
    "**/.claude/**",
    ".mcp.json",
    "**/.mcp.json",
    "~/.cursor",
    "~/.cursor/**",
    ".cursor",
    ".cursor/**",
    "**/.cursor",
    "**/.cursor/**",
    ".vscode/mcp.json",
    "**/.vscode/mcp.json",
    "mcp_config.json",
    "**/mcp_config.json",
]

[private_sources]
# T2 Strict Everywhere: local/workspace paths plus private enterprise sources.
paths = [
