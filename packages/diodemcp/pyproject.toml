[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diodemcp"
version = "0.1.0"
description = "Local taint-tracking firewall and Jev cross-encoder runtime for MCP servers and coding agents"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.19",
    "tokenizers>=0.20",
    "httpx>=0.27",
    "pydantic>=2.9",
    "typer>=0.12",
    "filelock>=3.16",
]

[project.scripts]
diodemcp = "diodemcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "onnx>=1.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/diodemcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
