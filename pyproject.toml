[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diodemcp"
version = "0.1.0"
description = "Local taint-tracking firewall and System-One Jev ONNX runtime for MCP servers and AI coding agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-security",
    "prompt-injection",
    "firewall",
    "onnxruntime",
    "claude-code",
    "cursor",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.19",
    "tokenizers>=0.20",
    "httpx>=0.27",
    "pydantic>=2.9",
    "typer>=0.12",
    "filelock>=3.16",
]

[project.urls]
Homepage = "https://github.com/PhilippFrenzel2005/diodemcp"
Repository = "https://github.com/PhilippFrenzel2005/diodemcp"
Issues = "https://github.com/PhilippFrenzel2005/diodemcp/issues"
Releases = "https://github.com/PhilippFrenzel2005/diodemcp/releases"

[project.scripts]
diodemcp = "diodemcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "onnx>=1.16",
]

[tool.hatch.build.targets.wheel]
packages = ["packages/diodemcp/src/diodemcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/packages/diodemcp/src",
    "/packages/diodemcp/pyproject.toml",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["packages/diodemcp/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
