<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="320" viewBox="0 0 1080 320" role="img" aria-label="DiodeMCP System-One Jev MCP Security Firewall Architecture">
  <defs>
    <linearGradient id="bgDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="coreGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="coreFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111c2d"/>
      <stop offset="100%" stop-color="#0b1320"/>
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Outer Canvas -->
  <rect x="1" y="1" width="1078" height="318" rx="16" fill="url(#bgDark)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Header Strip -->
  <circle cx="38" cy="36" r="7" fill="url(#coreGlow)"/>
  <path d="M 35 33 L 42 36 L 35 39 Z" fill="#090d16"/>
  <text x="54" y="42" fill="#f8fafc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="800" letter-spacing="0.4">DiodeMCP</text>
  <rect x="166" y="24" width="214" height="24" rx="12" fill="#0f2937" stroke="#155e75" stroke-width="1"/>
  <text x="273" y="40" text-anchor="middle" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600">SYSTEM-ONE JEV FIREWALL</text>

  <!-- Metric Pills Right -->
  <rect x="590" y="24" width="146" height="24" rx="6" fill="#111827" stroke="#334155"/>
  <text x="663" y="40" text-anchor="middle" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600">0.999 Suite A AUROC</text>

  <rect x="744" y="24" width="146" height="24" rx="6" fill="#111827" stroke="#334155"/>
  <text x="817" y="40" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600">0.4%–1.2% Suite A FPR</text>

  <rect x="898" y="24" width="154" height="24" rx="6" fill="#111827" stroke="#334155"/>
  <text x="975" y="40" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600">154ms CPU ONNX · Local</text>

  <line x1="28" y1="62" x2="1052" y2="62" stroke="#1e293b" stroke-width="1"/>

  <!-- Left Card: AI Coding Agent -->
  <rect x="28" y="86" width="276" height="202" rx="12" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="46" y="114" fill="#f1f5f9" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">AI Coding Agent / IDE</text>
  <text x="46" y="133" fill="#94a3b8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Claude Code · Cursor · Antigravity</text>

  <rect x="44" y="149" width="244" height="54" rx="8" fill="#0b1120" stroke="#1e3a5f"/>
  <text x="56" y="169" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">[TRUSTED_INTENT]</text>
  <text x="56" y="188" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">User task &amp; workspace scope</text>

  <rect x="44" y="215" width="244" height="56" rx="8" fill="#0b1120" stroke="#334155"/>
  <text x="56" y="235" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">[CANDIDATE_ACTION]</text>
  <text x="56" y="254" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">tools/call -&gt; sink args</text>

  <!-- Arrows Agent <-> DiodeMCP -->
  <line x1="306" y1="164" x2="364" y2="164" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <text x="336" y="155" text-anchor="middle" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">stdio</text>
  <line x1="366" y1="224" x2="308" y2="224" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="336" y="241" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">verdict</text>

  <!-- Center Card: DiodeMCP Firewall -->
  <rect x="368" y="76" width="344" height="222" rx="14" fill="url(#coreFill)" stroke="url(#coreGlow)" stroke-width="2"/>
  <text x="540" y="103" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="800">DiodeMCP Local Shim &amp; Engine</text>
  <text x="540" y="121" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">100% Local · Zero Cloud Calls · Fail-Closed</text>

  <rect x="386" y="133" width="308" height="36" rx="7" fill="#09101d" stroke="#1e293b"/>
  <text x="398" y="155" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11"><tspan fill="#22d3ee" font-weight="700">1. Taint Graph</tspan>  PRIVATE + UNTRUSTED spans</text>

  <rect x="386" y="176" width="308" height="36" rx="7" fill="#09101d" stroke="#1e293b"/>
  <text x="398" y="198" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11"><tspan fill="#34d399" font-weight="700">2. Tier-0 Gate</tspan>  Crypto keys &amp; catalog pins</text>

  <rect x="386" y="219" width="308" height="36" rx="7" fill="#09101d" stroke="#155e75"/>
  <text x="398" y="241" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11"><tspan fill="#67e8f9" font-weight="700">3. Jev INT8 ONNX</tspan>  p_enc · p_sem · p_hijack</text>

  <!-- Allow / Block badges -->
  <rect x="386" y="264" width="144" height="22" rx="5" fill="#052e16" stroke="#10b981"/>
  <text x="458" y="279" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">ALLOW -&gt; Forward</text>

  <rect x="542" y="264" width="152" height="22" rx="5" fill="#4c0519" stroke="#f43f5e"/>
  <text x="618" y="279" text-anchor="middle" fill="#fda4af" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">BLOCK + Span Pointer</text>

  <!-- Arrows DiodeMCP <-> MCP Servers -->
  <line x1="714" y1="164" x2="772" y2="164" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="744" y="155" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">safe RPC</text>
  <line x1="774" y1="224" x2="716" y2="224" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="744" y="241" text-anchor="middle" fill="#fcd34d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">tainted</text>

  <!-- Right Card: Upstream MCP Servers -->
  <rect x="776" y="86" width="276" height="202" rx="12" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="794" y="114" fill="#f1f5f9" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">Upstream MCP Servers</text>
  <text x="794" y="133" fill="#94a3b8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Local stdio · Remote HTTP / SSE</text>

  <rect x="792" y="149" width="244" height="54" rx="8" fill="#0b1120" stroke="#334155"/>
  <text x="804" y="169" fill="#f43f5e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">[PRIVATE_DATA]</text>
  <text x="804" y="188" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">.env · SSH keys · DB rows</text>

  <rect x="792" y="215" width="244" height="56" rx="8" fill="#0b1120" stroke="#78350f"/>
  <text x="804" y="235" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">[UNTRUSTED_DATA]</text>
  <text x="804" y="254" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Issues · PRs · tools/list · Web</text>
</svg>
